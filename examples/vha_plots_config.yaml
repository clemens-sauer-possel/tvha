# VHA Plots Configuration
# Organized by molecule and plot type
# Requires ruamel.yaml to properly parse floats in scientific notation

# Info: number of datapoints (i.e. non-Coulomb two-body terms + 1):
# 5 for H_2, 141 for H_4, 529 for LiH, 13 for CH_2, 43 for NO_3, 13 for CH

plotting:
  # Enable/disable specific plot types
  plot_histograms: true
  plot_density_distributions: true
  plot_cnot_count: true
  plot_circuit_depth: true
  plot_recommended_parameters: true
  plot_energy_over_threshold: true
  plot_energy_over_trotter: false
  plot_energy_heatmap: false
  plot_energy_over_noise: true
  plot_error_estimate: true
  plot_parameter_count: true
  plot_energy_landscape: false # Enable carefully: highly inefficient
  add_title: true

  # # Default parameters for all molecules
  # defaults:
  #   max_evals: 10000

  # Output directory pattern
  output_dir_template: "data_for_paper_tvha/plots_{molecule}"

molecules:
  H_2:
    basis_set: "sto3g"
    plot_recommended_parameters:
      list_of_cx_error_prob: [2e-3, 5e-3, 1e-2, 2e-2]
    plot_energy_over_trotter:
      threshold_gamma: [0.5, 1.0]
    plot_energy_over_noise:
      list_of_cx_error_prob:
        [0, 1e-6, 2e-6, 5e-6, 1e-5, 2e-5, 5e-5, 1e-4, 2e-4, 5e-4, 1e-3]
      trotter_steps: [1, 2, 5]
      threshold_gamma: [0.5, 1.0]
      max_evals: 10000

  CH_2:
    plot_recommended_parameters:
      list_of_cx_error_prob: [2e-3, 5e-3, 1e-2]
    plot_energy_over_trotter:
      threshold_gamma: [0.0, 0.25, 0.5, 0.75, 1.0]
    plot_energy_over_noise:
      list_of_cx_error_prob:
        [0, 1e-5, 2e-5, 5e-5, 1e-4, 2e-4, 5e-4, 1e-3, 2e-3, 5e-3, 1e-2]
      trotter_steps: [1, 2, 5]
      threshold_gamma: [0.2, 0.6, 1.0]
      max_evals: 10000

  H_4:
    basis_set: "sto3g"
    plot_recommended_parameters:
      list_of_cx_error_prob: [1e-3, 2e-3, 5e-3]
    plot_energy_over_threshold:
      trotter_steps: [1, 2, 5]
      max_evals: [1000, 2000, 5000]
    plot_energy_over_trotter:
      threshold_gamma: [0.0, 0.25, 0.5, 0.75, 1.0]
    plot_energy_heatmap:
      list_of_trotter_steps: [1, 2, 3, 4, 5]
      max_evals: [1000, 2000, 3000, 4000, 5000]
    plot_energy_over_noise:
      list_of_cx_error_prob:
        [0, 1e-6, 2e-6, 5e-6, 1e-5, 2e-5, 5e-5, 1e-4, 2e-4, 5e-4, 1e-3]
      trotter_steps: [1, 2, 5]
      threshold_gamma: [0.2, 0.5, 0.9, 1.0]
      max_evals: 5000
    plot_error_estimate:
      trotter_steps: [1, 2, 5]
      max_evals: [1000, 2000, 5000]

